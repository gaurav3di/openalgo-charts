<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>OpenAlgo Charts - yfinance chart grid</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="grid-page">
  <!--
    The grid view. Every chart is a widget from openalgo-charts/widget inside
    the tier's chart grid; this bar only picks the layout, the links and the
    file, the same way the main page's toolbar drives its own charts.
  -->
  <header class="shellbar gridbar" role="toolbar" aria-label="Chart grid">
    <a class="brand" href="index.html" title="Back to the single chart view">
      <span class="brand-dot"></span><span class="gridbar__name">OpenAlgo <em>yfinance</em></span>
    </a>
    <div class="divider"></div>
    <div class="group" id="grid-presets" role="group" aria-label="Layout"></div>
    <div class="divider"></div>
    <span class="gridbar__label" id="grid-links-label">Link</span>
    <div class="group" id="grid-links" role="group" aria-labelledby="grid-links-label"></div>
    <div class="divider"></div>
    <div class="group">
      <button id="grid-import" class="tbtn" type="button" title="Open a saved layout file">Import</button>
      <button id="grid-export" class="tbtn" type="button" title="Save this grid as a layout file">Export</button>
      <input id="grid-file" type="file" accept="application/json,.json" hidden />
      <a class="tbtn" href="index.html">Single chart view</a>
    </div>
    <span id="grid-status" class="gridbar__status" role="status" aria-live="polite"></span>
  </header>
  <main id="grid" class="grid-stage" aria-label="Charts"></main>
  <script type="module">
    import { initGridView } from './src/grid.js';
    initGridView();
  </script>
</body>
</html>
